name: kaisa-corteza
services:

  corteza-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${CORTEZA_DB_USER}
      - POSTGRES_PASSWORD=${CORTEZA_DB_PASS}
      - POSTGRES_DB=${CORTEZA_DB_NAME}
    volumes:
      - corteza-db-data:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CORTEZA_DB_USER} -d ${CORTEZA_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  corteza-app:
    image: cortezaproject/corteza:2024.9
    restart: unless-stopped
    depends_on:
      corteza-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    environment:
      - DB_DSN=postgres://${CORTEZA_DB_USER}:${CORTEZA_DB_PASS}@corteza-db:5432/${CORTEZA_DB_NAME}?sslmode=disable
      - HTTP_WEBHOOK_ENABLED=false
      - DOMAIN=crm.privacyfirstautomation.com
    volumes:
      - corteza-app-data:/var/lib/corteza
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  corteza-app-data:
  corteza-db-data:
