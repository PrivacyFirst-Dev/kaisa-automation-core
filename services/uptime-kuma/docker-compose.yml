name: kaisa-uptime-kuma
services:
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - kuma-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  kuma-data:
    external: true
    name: kuma-data
